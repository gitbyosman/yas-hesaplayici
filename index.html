<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yaş Hesaplayıcı</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd6e8"/>
<style>
:root{
  --bg: linear-gradient(135deg,#fff6fb 0%,#ffeef8 100%);
  --card:#ffffff;
  --accent:#ff70b8;
  --muted:#6b6b6b;
}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
body{margin:0;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.app{width:100%;max-width:420px;background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,0.08);padding:22px;text-align:center;}
.icon{width:72px;height:72px;margin:0 auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffd6e8,#ffb6df);}
h1{margin:6px 0 2px;font-size:20px;color:#2b2b2b;}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:16px;}
input[type="date"]{width:100%;padding:12px;border-radius:10px;border:1px solid #f0cde0;font-size:16px;background:#fff;}
.btn{margin-top:12px;width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:16px;}
.result{margin-top:18px;padding:14px;border-radius:10px;background:linear-gradient(180deg,#fff 0%,#fff8fb 100%);border:1px solid #fff0f6;font-size:16px;color:#333;white-space:pre-line;}
.footer{margin-top:14px;font-size:12px;color:var(--muted);}
.small{font-size:13px;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Yaş Hesaplayıcı">
    <div class="icon" aria-hidden="true">
      <img src="icons/icon-192.png" alt="" style="width:56px;height:56px;border-radius:8px;">
    </div>
    <h1>Yaş Hesaplayıcı</h1>
    <div class="subtitle">Doğum tarihine göre yaşını öğren</div>

    <label for="birth" class="small">Doğum Tarihi</label>
    <input id="birth" type="date" max="" aria-label="Doğum tarihi">
    <button class="btn" id="calc">Hesapla</button>

    <div id="result" class="result" aria-live="polite">Doğum tarihi seçip "Hesapla" butonuna bas.</div>
    <div class="footer">Offline destekli — Ana ekrana ekleyip uygulama gibi kullanabilirsin.</div>
  </div>

<script>
// Set max to today
(function(){
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  const max = `${yyyy}-${mm}-${dd}`;
  document.getElementById('birth').setAttribute('max', max);
})();

function hesapla() {
  const input = document.getElementById('birth');
  if (!input.value) {
    document.getElementById('result').innerText = 'Lütfen doğum tarihini seçin.';
    return;
  }
  const dogum = new Date(input.value + 'T00:00:00');
  const simdi = new Date();
  let yil = simdi.getFullYear() - dogum.getFullYear();
  let ay = simdi.getMonth() - dogum.getMonth();
  let gun = simdi.getDate() - dogum.getDate();

  if (gun < 0) {
    ay--;
    // gün sayısını doğru hesapla: önceki ayın gün sayısı
    const prevMonthLastDay = new Date(simdi.getFullYear(), simdi.getMonth(), 0).getDate();
    gun += prevMonthLastDay;
  }
  if (ay < 0) {
    yil--;
    ay += 12;
  }

  // days until next birthday
  let nextBD = new Date(simdi.getFullYear(), dogum.getMonth(), dogum.getDate());
  if (nextBD < simdi) nextBD.setFullYear(nextBD.getFullYear() + 1);
  const diffDays = Math.ceil((nextBD - simdi) / (1000*60*60*24));

  document.getElementById('result').innerText = `Yaşın: ${yil} yıl, ${ay} ay, ${gun} gün\nDoğum gününe ${diffDays} gün kaldı 🎉`;
}

document.getElementById('calc').addEventListener('click', hesapla);

// register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(function(err){
    console.log('SW register failed', err);
  });
}
</script>
</body>
</html>
